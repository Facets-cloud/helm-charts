---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
{{- $hooks := ternary .Values.ReferencedConfig .Values.Config (eq .Values.mode "referenced") }}
{{- range $path, $config := $hooks }}
  {{ $path }}: |
{{ $config | indent 4 -}}
{{- end -}}
