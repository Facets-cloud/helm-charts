        echo Got Synchronization event
        exit 0
      fi


      for namespace in $(jq -r '.[] | .object.metadata | select(.name == "default" | not ) | .name' $BINDING_CONTEXT_PATH);
      do
        # The namespace can be deleted before this event is handled. Copying into it then fails
        # on every retry, so check it is still Active first.
        phase=$(kubectl get namespace "$namespace" -o jsonpath='{.status.phase}' --ignore-not-found 2>/dev/null)
        if [[ "$phase" != "Active" ]] ; then
          echo "secret-copier: SKIP namespace $namespace (phase=${phase:-gone})" >&2
          continue
        fi
        for secret in $(kubectl -n default get secret -l secret-copier=yes -o name);
        do
          kubectl -n default get $secret -o json | \
            jq -r ".metadata.namespace=\"${namespace}\" |
                    .metadata |= with_entries(select([.key] | inside([\"name\", \"namespace\", \"labels\"])))" \
            | kubectl::replace_or_create
        done
      done
    }
    common::run_hook "$@"
