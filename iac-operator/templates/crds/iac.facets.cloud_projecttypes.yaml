---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: projecttypes.iac.facets.cloud
spec:
  group: iac.facets.cloud
  names:
    kind: ProjectType
    listKind: ProjectTypeList
    plural: projecttypes
    singular: projecttype
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: IaC engine for this project type
      jsonPath: .spec.iacTool
      name: IaC Tool
      type: string
    - description: IaC engine version
      jsonPath: .spec.iacToolVersion
      name: IaC Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ProjectType is the Schema for the projecttypes API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProjectTypeSpec defines the desired state of ProjectType.
              A ProjectType is the archetype that templates a project (Blueprint) and holds
              per-type IaC policy. For now it carries only the IaC engine and version; this
              is the single source of truth for which engine releases of this type run on.

              The generated workspace uses terraform_data, so the engine must be Terraform 1.4.0
              or newer, or OpenTofu 1.6.0 or newer.
            properties:
              iacTool:
                description: |-
                  IacTool selects the IaC engine for every release of this project type.
                  Defaults to TERRAFORM when unset.
                enum:
                - TERRAFORM
                - OPENTOFU
                type: string
              iacToolVersion:
                description: |-
                  IacToolVersion pins the engine version: Terraform 1.4.0 or newer (e.g. "1.5.7"),
                  or OpenTofu 1.6.0 or newer (e.g. "1.12.3"). A prerelease or build suffix is
                  allowed. Unset uses the engine baked into the release-pod image.
                pattern: ^$|^v?[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.\-+]*)?$
                type: string
            type: object
            x-kubernetes-validations:
            - message: 'Terraform below 1.4.0 cannot plan the generated workspace:
                it has no terraform_data resource'
              rule: (has(self.iacTool) && self.iacTool == 'OPENTOFU') || !has(self.iacToolVersion)
                || size(self.iacToolVersion) == 0 || !self.iacToolVersion.matches('^v?(0[.]|1[.][0-3]([.]|[-+]|$))')
            - message: 'OpenTofu below 1.6.0 cannot plan the generated workspace:
                it has no terraform_data resource'
              rule: '!(has(self.iacTool) && self.iacTool == ''OPENTOFU'') || !has(self.iacToolVersion)
                || size(self.iacToolVersion) == 0 || !self.iacToolVersion.matches(''^v?(0[.]|1[.][0-5]([.]|[-+]|$))'')'
        type: object
    served: true
    storage: true
    subresources: {}
