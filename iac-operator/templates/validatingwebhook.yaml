{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "iac-operator.fullname" . }}-validating-webhook
  labels:
    {{- include "iac-operator.labels" . | nindent 4 }}
webhooks:
- name: release.iac.facets.cloud
  clientConfig:
    service:
      name: {{ include "iac-operator.fullname" . }}-webhook-service
      namespace: {{ include "iac-operator.namespace" . }}
      path: /validate-iac-facets-cloud-v1-release
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  admissionReviewVersions:
  - v1
  - v1beta1
  sideEffects: None
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  rules:
  - apiGroups:
    - iac.facets.cloud
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - releases
    scope: "*"
- name: release-delete.iac.facets.cloud
  clientConfig:
    service:
      name: {{ include "iac-operator.fullname" . }}-webhook-service
      namespace: {{ include "iac-operator.namespace" . }}
      path: /validate-iac-facets-cloud-v1-release
  # DELETE fails open so a down operator/webhook can't block Release deletion
  # (and the ownerRef GC of its pods/config/secret).
  failurePolicy: Ignore
  admissionReviewVersions:
  - v1
  - v1beta1
  sideEffects: None
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  rules:
  - apiGroups:
    - iac.facets.cloud
    apiVersions:
    - v1
    operations:
    - DELETE
    resources:
    - releases
    scope: "*"
- name: releasetemplate.iac.facets.cloud
  clientConfig:
    service:
      name: {{ include "iac-operator.fullname" . }}-webhook-service
      namespace: {{ include "iac-operator.namespace" . }}
      path: /validate-iac-facets-cloud-v1-releasetemplate
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  admissionReviewVersions:
  - v1
  - v1beta1
  sideEffects: None
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  rules:
  - apiGroups:
    - iac.facets.cloud
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - releasetemplates
    scope: "*"
- name: projecttype.iac.facets.cloud
  clientConfig:
    service:
      name: {{ include "iac-operator.fullname" . }}-webhook-service
      namespace: {{ include "iac-operator.namespace" . }}
      path: /validate-iac-facets-cloud-v1-projecttype
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  admissionReviewVersions:
  - v1
  - v1beta1
  sideEffects: None
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  rules:
  - apiGroups:
    - iac.facets.cloud
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - projecttypes
    scope: "*"
{{- end }}